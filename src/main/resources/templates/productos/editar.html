<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::section}, 'Editar producto')}">

<section>
    <style>
        .input-error { border: 2px solid #e74c3c; background-color: #fdecea; }
        .error-text { color: #e74c3c; font-size: 14px; margin-bottom: 8px; }
        .card { padding: 20px; margin-bottom: 20px; }
    </style>

    <div class="card">
        <h3>✏️ Editar producto</h3>

        <form th:action="@{/web/productos/actualizar/{id}(id=${producto.id})}"
              th:object="${producto}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <label>Artículo *</label>
            <input th:field="*{sku}" placeholder="Articulo"
                   th:classappend="${#fields.hasErrors('sku')} ? 'input-error'"/>
            <div th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}" class="error-text"></div>

            <label>Tipo de talle *</label>
            <select id="tipoTalle" th:field="*{tipoTalle}">
                <option value="ALFABETICO">Alfabético (S - XL)</option>
                <option value="NUMERICO">Numérico (38 - 58)</option>
            </select>

            <div id="bloqueAlfabetico"
                 th:style="*{tipoTalle?.name() == 'NUMERICO' ? 'display: none' : 'display: block'}">

                <h4>Precios Base (S a XL) *</h4>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div style="flex:1">
                        <label>Precio Público *</label>
                        <input type="number" step="0.01" th:field="*{precioBasePublico}"/>
                    </div>
                    <div style="flex:1">
                        <label>Precio Mayorista *</label>
                        <input type="number" step="0.01" th:field="*{precioBaseMayorista}"/>
                    </div>
                </div>

                <h4>Precios Especiales</h4>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div style="flex:1">
                        <label>2XL / 3XL Público</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial1Publico}">
                    </div>
                    <div style="flex:1">
                        <label>2XL / 3XL Mayorista</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial1Mayorista}">
                    </div>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div style="flex:1">
                        <label>4XL Público</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial2Publico}">
                    </div>
                    <div style="flex:1">
                        <label>4XL Mayorista</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial2Mayorista}">
                    </div>
                </div>

                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div style="flex:1">
                        <label>5XL / 6XL Público</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial3Publico}">
                    </div>
                    <div style="flex:1">
                        <label>5XL / 6XL Mayorista</label>
                        <input type="number" step="0.01" th:field="*{precioEspecial3Mayorista}">
                    </div>
                </div>
            </div>

            <div id="bloqueNumerico"
                 th:style="*{tipoTalle?.name() == 'NUMERICO' ? 'display: block' : 'display: none'}">
                <h4>Precio único (38 al 58)</h4>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <div style="flex:1">
                        <label>Precio Público *</label>
                        <input type="number" step="0.01" th:field="*{precioBasePublico}"/>
                    </div>
                    <div style="flex:1">
                        <label>Precio Mayorista *</label>
                        <input type="number" step="0.01" th:field="*{precioBaseMayorista}"/>
                    </div>
                </div>
            </div>

            <label>Proveedor</label>
            <select th:field="*{proveedor}">
                <option value="">Sin proveedor</option>
                <option th:each="prov : ${proveedores}"
                        th:value="${prov.id}"
                        th:text="${prov.nombre}">
                </option>
            </select>

            <br><br>
            <button class="button-e" type="submit">Guardar Cambios</button>
            <a th:href="@{/web/productos}" style="margin-left: 10px;">Cancelar</a>

        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const tipoTalle = document.getElementById("tipoTalle");
            const bloqueAlfabetico = document.getElementById("bloqueAlfabetico");
            const bloqueNumerico = document.getElementById("bloqueNumerico");

            function toggleBloques(){
                const esNumerico = tipoTalle.value === "NUMERICO";

                if(bloqueAlfabetico) bloqueAlfabetico.style.display = esNumerico ? "none" : "block";
                if(bloqueNumerico) bloqueNumerico.style.display = esNumerico ? "block" : "none";

                // Importante: deshabilitar los inputs del bloque oculto para que no se envíen datos erróneos
                if(bloqueAlfabetico) {
                    bloqueAlfabetico.querySelectorAll("input").forEach(i => i.disabled = esNumerico);
                }
                if(bloqueNumerico) {
                    bloqueNumerico.querySelectorAll("input").forEach(i => i.disabled = !esNumerico);
                }
            }

            tipoTalle.addEventListener("change", toggleBloques);
            toggleBloques(); // Ejecutar al cargar para mostrar el estado actual del producto
        });
    </script>
</section>
</html>
