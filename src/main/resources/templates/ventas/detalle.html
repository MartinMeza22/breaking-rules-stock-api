<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section}, 'Detalle Venta')">

<section>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="card venta-card">
        <div class="badge-precio"
             th:classappend="${venta.cliente.tipoCliente.name() == 'MAYORISTA'} ? ' mayorista' : ' publico'"
             th:text="${venta.cliente.tipoCliente.name() == 'MAYORISTA'} ? 'P.M' : 'P.P'">
        </div>

        <h3 th:text="'Venta #' + ${venta.id}"></h3>

        <p>
            Cliente:
            <span th:text="${venta.nombreClienteMostrar}"></span>
        </p>
    </div>

    <div class="card">
        <h3>➕ Agregar Producto</h3>

        <input type="text" id="scanner" placeholder="Escanear código..." />

        <form th:action="@{/web/ventas/agregar-producto}" method="post" id="formAgregarProducto">

            <input type="hidden" name="ventaId" th:value="${venta.id}"/>

            <div class="campo">

                <label>Buscar producto</label>
                <input type="text" id="buscarProducto" placeholder="Buscar producto...">

                <label style="margin-top:10px;">Producto *</label>
                <select name="varianteId" id="varianteSelect" size="8" class="select-cliente">

                    <option value="">Seleccionar producto</option>

                    <option th:each="v : ${variantes}"
                            th:value="${v.id}"
                            th:text="${v.producto.nombre + ' - ' + v.color + ' - ' + v.talle + ' (Stock: ' + v.stock + ')'}">
                    </option>

                </select>

                <div id="errorVariante" class="error-text"></div>

            </div>

            <label>Cantidad</label>
            <input type="number"
                   name="cantidad"
                   id="cantidad"
                   placeholder="Cantidad"
                   min="1"/>

            <div id="errorCantidad" class="error-text"></div>

            <button class="btn-accion" type="submit">
                Agregar
            </button>
        </form>

        <div class="card venta-detalles">
            <h3>Productos en la venta</h3>

            <table th:if="${!detalles.isEmpty()}">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="d : ${detalles}">
                    <td th:text="${d.variante.producto.nombre + ' ' + d.variante.color + ' ' + d.variante.talle}"></td>
                    <td>
                        <form th:action="@{/web/ventas/actualizar-cantidad}" method="post" style="display:flex; gap:5px;">
                            <input type="hidden" name="ventaId" th:value="${venta.id}" />
                            <input type="hidden" name="detalleId" th:value="${d.id}" />

                            <input type="number" name="cantidad"
                                   th:value="${d.cantidad}"
                                   min="1"
                                   style="width:60px;" />

                            <button type="submit">✔</button>
                        </form>
                    </td>
                    <td th:text="${d.precioUnitario}"></td>
                    <td th:text="${d.subtotal}"></td>

                    <td>
                        <form th:action="@{/web/ventas/eliminar-producto}" method="post"
                              onsubmit="return confirm('¿Eliminar producto de la venta?')">

                            <input type="hidden" name="ventaId" th:value="${venta.id}" />
                            <input type="hidden" name="detalleId" th:value="${d.id}" />

                            <button type="submit" class="btn-eliminar icon-only">🗑</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <p>
                Total:
                <span id="totalOriginal" th:text="${venta.total}"></span>
            </p>

            <p>
                Total con descuento:
                <span id="totalConDescuento">0</span>
            </p>

            <form th:action="@{/web/ventas/finalizar}" method="post">
                <input type="hidden" name="ventaId" th:value="${venta.id}"/>

                <label>Descuento (%)</label>

                <input type="number"
                       id="descuento"
                       name="descuento"
                       step="0.01"
                       min="0"
                       max="100"
                       placeholder="0">

                <button class="btn-finalizar"
                        th:disabled="${detalles.isEmpty()}">
                    Finalizar Venta
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function(){

            const select = document.getElementById("varianteSelect");
            const cantidadInput = document.getElementById("cantidad");
            const form = document.getElementById("formAgregarProducto");

            const ventaId = /*[[${venta.id}]]*/ 0;


            // DESCUENTO EN TIEMPO REAL (fix . y ,)

            const descuentoInput = document.getElementById("descuento");
            const totalOriginalEl = document.getElementById("totalOriginal");
            const totalConDescuentoEl = document.getElementById("totalConDescuento");

            if (descuentoInput && totalOriginalEl && totalConDescuentoEl) {

                const raw = totalOriginalEl.innerText.trim();

                let totalOriginal;

                if (raw.includes(",") && raw.includes(".")) {
                    // formato: 1.234,56
                    totalOriginal = parseFloat(
                        raw.replace(/\./g, "").replace(",", ".")
                    );
                } else if (raw.includes(",")) {
                    // formato: 1234,56
                    totalOriginal = parseFloat(
                        raw.replace(",", ".")
                    );
                } else {
                    // formato: 1234.56 (EL TUYO)
                    totalOriginal = parseFloat(raw);
                }

                totalOriginal = totalOriginal || 0;

                totalConDescuentoEl.innerText = totalOriginal.toFixed(2);

                descuentoInput.addEventListener("input", function(){

                    let descuento = parseFloat(this.value.replace(",", ".")) || 0;

                    if(descuento < 0) descuento = 0;
                    if(descuento > 100) descuento = 100;

                    const totalFinal = totalOriginal - (totalOriginal * (descuento / 100));

                    totalConDescuentoEl.innerText = totalFinal.toFixed(2);
                });
            }

            // =========================
            // ENTER EN CANTIDAD (manual)
            // =========================
            cantidadInput.addEventListener("keydown", function(e){
                if(e.key === "Enter"){
                    e.preventDefault();
                    form.requestSubmit();
                }
            });

            // =========================
            // SCANNER GLOBAL
            // =========================
            let buffer = "";
            let lastKeyTime = Date.now();

            document.addEventListener("keydown", function(e){

    const tag = e.target.tagName;

    if(tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA"){
        return;
    }

    const currentTime = Date.now();

    if(currentTime - lastKeyTime > 200){
        buffer = "";
    }

    lastKeyTime = currentTime;

    if(e.key === "Enter"){

        e.preventDefault();

        if(buffer.length > 3){

            fetch("/web/ventas/scan", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "ventaId=" + ventaId + "&codigo=" + buffer.trim()
            })
            .then(res => res.json())
            .then(data => {

                if(data.id){

                    if(data.existe){

                        // 🔥 YA EXISTE → sumar automáticamente
                        fetch("/web/ventas/agregar-producto", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },
                            body:
                                "ventaId=" + ventaId +
                                "&varianteId=" + data.id +
                                "&cantidad=1"
                        })
                        .then(() => location.reload());

                    } else {

                        // 🔥 NO EXISTE → ir a cantidad
                        select.value = data.id;
                        cantidadInput.value = 1;
                        cantidadInput.focus();
                        cantidadInput.select();
                    }

                } else {
                    alert("Código no encontrado");
                }

            });
        }

        buffer = "";
        return;
    }

    buffer += e.key;
});

        });
    </script>

    <style>
        #buscarProducto{
            width:100%;
            padding:8px;
            margin-bottom:8px;
        }

        #varianteSelect{
            width:100%;
        }

        .btn-accion{
            margin-bottom:16px;
        }

        .venta-detalles table {
            font-size: 18px;
        }

        .venta-detalles th {
            font-size: 19px;
        }

        .venta-detalles td {
            font-size: 18px;
        }

        .venta-detalles td {

            padding: 12px;
        }

        .venta-detalles input {
            font-size: 18px;
        }
    </style>

</section>
</html>
